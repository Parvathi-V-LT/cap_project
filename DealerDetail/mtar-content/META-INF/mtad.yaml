_schema-version: 3.3.0
ID: DealerDetail
description: A simple CAP project.
version: 1.0.0
modules:
- name: DealerDetail-srv
  type: javascript.nodejs
  path: DealerDetail-srv
  requires:
  - name: DealerDetail-auth
  - name: DealerDetail-db
  - name: DealerDetail-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
- name: DealerDetail-db-deployer
  type: com.sap.xs.hdi
  path: DealerDetail-db-deployer
  requires:
  - name: DealerDetail-db
  parameters:
    buildpack: nodejs_buildpack
resources:
- name: DealerDetail-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: DealerDetail-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: DealerDetail-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: DealerDetail-destination
  type: org.cloudfoundry.managed-service
  parameters:
    service: destination
    service-plan: lite
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
